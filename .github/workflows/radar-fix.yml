# Comment "@claude fix this" on a radar Issue: Claude fixes it on a branch and opens a draft PR.
# Uses the secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`); no API key needed.
name: radar-fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  fix:
    # Only on Issues (not PRs) labelled radar, and only for people with write access.
    if: >
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude') &&
      contains(github.event.issue.labels.*.name, 'radar') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fix with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: radar/fix-
          claude_args: >-
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(dotnet build:*),Bash(dotnet restore:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*)"
